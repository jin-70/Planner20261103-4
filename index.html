<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 업무 플래너</title>
    <meta name="description" content="개인 업무를 등록하고 마감일과 완료 상태를 체계적으로 관리하는 업무용 플래너" />
    <meta property="og:title" content="내 업무 플래너" />
    <meta property="og:description" content="개인 업무를 등록하고 마감일과 완료 상태를 체계적으로 관리하는 업무용 플래너" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg-main: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --blue-primary: #2563eb;
        --blue-hover: #1d4ed8;
        --blue-light: #eff6ff;
        --blue-border: #bfdbfe;
        --red-text: #dc2626;
        --red-bg: #fef2f2;
        --red-border: #fecaca;
        --orange-text: #c2410c;
        --orange-bg: #fff7ed;
        --orange-border: #fed7aa;
        --gray-text: #475569;
        --gray-bg: #f1f5f9;
        --gray-border: #cbd5e1;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding: 24px 16px 48px;
        min-height: 100vh;
      }

      .planner-container {
        max-width: 840px;
        margin: 0 auto;
      }

      /* 헤더 */
      header {
        margin-bottom: 20px;
      }

      .header-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      }

      .logo-icon svg {
        width: 20px;
        height: 20px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }

      .header-meta {
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .today-badge {
        font-weight: 600;
        color: var(--blue-primary);
        background: var(--blue-light);
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--blue-border);
      }

      /* 저장 안내 배너 */
      .sync-notice-banner {
        background-color: #ffffff;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--blue-primary);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-sm);
      }

      .sync-notice-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sync-notice-left svg {
        width: 16px;
        height: 16px;
        color: var(--blue-primary);
        flex-shrink: 0;
      }

      /* 오류 경고 알림 (저장 실패 등) */
      .alert-banner {
        display: none;
        background-color: var(--red-bg);
        border: 1px solid var(--red-border);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        color: var(--red-text);
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 20px;
        align-items: center;
        gap: 10px;
        animation: fadeIn 0.2s ease-out;
      }

      .alert-banner.active {
        display: flex;
      }

      .alert-banner svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      /* 입력 폼 영역 */
      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 20px;
        margin-bottom: 24px;
      }

      .form-section-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .form-section-title svg {
        width: 18px;
        height: 18px;
        color: var(--blue-primary);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      .input-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .input-label .required-dot {
        color: var(--red-text);
        margin-left: 2px;
      }

      .input-label .optional-text {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 400;
      }

      .text-input {
        width: 100%;
        padding: 11px 14px;
        font-size: 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        outline: none;
        color: var(--text-primary);
        background-color: #ffffff;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .text-input:focus {
        border-color: var(--blue-primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .text-input.has-error {
        border-color: var(--red-text);
        background-color: #fffafb;
      }

      .validation-msg {
        font-size: 12px;
        color: var(--red-text);
        display: none;
        align-items: center;
        gap: 4px;
        margin-top: 2px;
      }

      .validation-msg.active {
        display: flex;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }

      @media (max-width: 600px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      /* 우선순위 선택 버튼 그룹 */
      .priority-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .priority-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 8px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background-color: #ffffff;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }

      .priority-btn:hover {
        background-color: var(--gray-bg);
      }

      .priority-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      .priority-indicator.high { background-color: #dc2626; }
      .priority-indicator.medium { background-color: #2563eb; }
      .priority-indicator.low { background-color: #64748b; }

      .priority-btn[data-priority="high"].active {
        border-color: #fca5a5;
        background-color: var(--red-bg);
        color: var(--red-text);
        font-weight: 700;
        box-shadow: 0 0 0 1px #dc2626 inset;
      }

      .priority-btn[data-priority="medium"].active {
        border-color: var(--blue-border);
        background-color: var(--blue-light);
        color: var(--blue-primary);
        font-weight: 700;
        box-shadow: 0 0 0 1px var(--blue-primary) inset;
      }

      .priority-btn[data-priority="low"].active {
        border-color: var(--gray-border);
        background-color: var(--gray-bg);
        color: #334155;
        font-weight: 700;
        box-shadow: 0 0 0 1px #475569 inset;
      }

      /* 날짜 인풋 */
      .date-input-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .date-input {
        flex: 1;
        padding: 9px 12px;
        font-size: 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        outline: none;
        color: var(--text-primary);
        background-color: #ffffff;
        font-family: inherit;
      }

      .date-input:focus {
        border-color: var(--blue-primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .date-clear-btn {
        padding: 9px 12px;
        font-size: 12px;
        color: var(--text-secondary);
        background-color: var(--gray-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s;
      }

      .date-clear-btn:hover {
        background-color: #e2e8f0;
      }

      /* 추가 버튼 */
      .submit-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background-color: var(--blue-primary);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background-color 0.15s, transform 0.05s;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        min-height: 46px;
      }

      .submit-btn:hover {
        background-color: var(--blue-hover);
      }

      .submit-btn:active {
        transform: translateY(1px);
      }

      .submit-btn svg {
        width: 18px;
        height: 18px;
      }

      /* 필터 & 요약 바 */
      .list-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .list-count-summary {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .summary-badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 12px;
        background-color: #e2e8f0;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .filter-chip {
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid var(--border-color);
        background-color: #ffffff;
        color: var(--text-secondary);
        border-radius: 20px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
      }

      .filter-chip:hover {
        background-color: var(--gray-bg);
      }

      .filter-chip.active {
        background-color: var(--blue-primary);
        color: #ffffff;
        border-color: var(--blue-primary);
      }

      /* 업무 목록 카드 */
      .tasks-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .task-card {
        background-color: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.15s;
        box-shadow: var(--shadow-sm);
        position: relative;
      }

      .task-card:hover {
        border-color: #cbd5e1;
        box-shadow: var(--shadow-md);
      }

      .task-card.completed {
        background-color: #f8fafc;
        border-color: #e2e8f0;
      }

      .task-card.completed .task-title {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      /* 체크박스 커스텀 */
      .checkbox-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .custom-checkbox {
        width: 22px;
        height: 22px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background-color: #ffffff;
        transition: all 0.15s;
        color: transparent;
      }

      .custom-checkbox:hover {
        border-color: var(--blue-primary);
      }

      .custom-checkbox.checked {
        background-color: var(--blue-primary);
        border-color: var(--blue-primary);
        color: #ffffff;
      }

      .custom-checkbox svg {
        width: 14px;
        height: 14px;
        stroke-width: 3;
      }

      /* 업무 본문 */
      .task-content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .task-title {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-primary);
        word-break: break-word;
        line-height: 1.4;
      }

      .task-meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* 뱃지 스타일 */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: var(--radius-sm);
        white-space: nowrap;
      }

      .badge-priority-high {
        background-color: var(--red-bg);
        color: var(--red-text);
        border: 1px solid var(--red-border);
      }

      .badge-priority-medium {
        background-color: var(--blue-light);
        color: var(--blue-primary);
        border: 1px solid var(--blue-border);
      }

      .badge-priority-low {
        background-color: var(--gray-bg);
        color: var(--gray-text);
        border: 1px solid var(--gray-border);
      }

      .badge-date {
        background-color: #f8fafc;
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
      }

      .badge-status-overdue {
        background-color: var(--red-bg);
        color: var(--red-text);
        border: 1px solid var(--red-border);
        font-weight: 700;
      }

      .badge-status-today {
        background-color: var(--orange-bg);
        color: var(--orange-text);
        border: 1px solid var(--orange-border);
        font-weight: 700;
      }

      .badge-status-completed {
        background-color: #f0fdf4;
        color: #16a34a;
        border: 1px solid #bbf7d0;
      }

      /* 삭제 버튼 */
      .delete-btn {
        background: transparent;
        border: none;
        padding: 8px;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        transition: color 0.15s, background-color 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .delete-btn:hover {
        color: var(--red-text);
        background-color: var(--red-bg);
      }

      .delete-btn svg {
        width: 18px;
        height: 18px;
      }

      /* 빈 목록 안내 */
      .empty-state {
        background-color: #ffffff;
        border: 1px dashed var(--border-color);
        border-radius: var(--radius-lg);
        padding: 48px 20px;
        text-align: center;
        color: var(--text-secondary);
      }

      .empty-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        color: #94a3b8;
        background-color: #f1f5f9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .empty-icon svg {
        width: 24px;
        height: 24px;
      }

      .empty-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .empty-description {
        font-size: 13px;
        color: var(--text-muted);
        max-width: 320px;
        margin: 0 auto;
        line-height: 1.6;
      }

      /* 하단 툴바 */
      .footer-tools {
        margin-top: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 8px;
        border-top: 1px solid var(--border-color);
        padding-top: 16px;
      }

      .save-status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #16a34a;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .save-status-indicator.visible {
        opacity: 1;
      }

      .save-status-indicator svg {
        width: 14px;
        height: 14px;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="planner-container">
      <!-- 헤더 -->
      <header>
        <div class="header-title-row">
          <div class="logo-group">
            <div class="logo-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </div>
            <h1>내 업무 플래너</h1>
          </div>
          <div class="header-meta">
            <span>오늘:</span>
            <span id="currentDateDisplay" class="today-badge"></span>
          </div>
        </div>
      </header>

      <!-- 저장 안내 배너 -->
      <div class="sync-notice-banner" role="status">
        <div class="sync-notice-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
          <span>이 브라우저에 저장되며 다른 기기와 자동 동기화되지 않습니다.</span>
        </div>
        <div id="saveIndicator" class="save-status-indicator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>저장됨</span>
        </div>
      </div>

      <!-- 오류 안내 (저장 실패 등) -->
      <div id="alertBanner" class="alert-banner" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alertBannerMessage">저장되지 않았습니다. 브라우저 저장소 설정을 확인해주세요.</span>
      </div>

      <!-- 업무 등록 폼 영역 -->
      <section class="card" aria-labelledby="formTitle">
        <h2 id="formTitle" class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          새 업무 등록
        </h2>

        <form id="taskForm" onsubmit="event.preventDefault(); handleAddTask();">
          <!-- 업무명 입력 -->
          <div class="input-group">
            <label for="taskTitleInput" class="input-label">
              <span>업무명<span class="required-dot">*</span></span>
            </label>
            <input
              type="text"
              id="taskTitleInput"
              class="text-input"
              placeholder="수행할 업무명을 입력하세요 (예: 3분기 결산 보고서 작성)"
              autocomplete="off"
            />
            <div id="titleValidationMsg" class="validation-msg">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>업무명을 입력해주세요. 공백만으로는 등록할 수 없습니다.</span>
            </div>
          </div>

          <!-- 우선순위 & 마감일 -->
          <div class="form-row">
            <!-- 우선순위 -->
            <div class="input-group" style="margin-bottom: 0;">
              <label class="input-label">우선순위</label>
              <div class="priority-options" role="radiogroup" aria-label="우선순위 선택">
                <button
                  type="button"
                  class="priority-btn"
                  data-priority="high"
                  role="radio"
                  aria-checked="false"
                  onclick="selectPriority('high')"
                >
                  <span class="priority-indicator high"></span>
                  <span>높음</span>
                </button>
                <button
                  type="button"
                  class="priority-btn active"
                  data-priority="medium"
                  role="radio"
                  aria-checked="true"
                  onclick="selectPriority('medium')"
                >
                  <span class="priority-indicator medium"></span>
                  <span>보통</span>
                </button>
                <button
                  type="button"
                  class="priority-btn"
                  data-priority="low"
                  role="radio"
                  aria-checked="false"
                  onclick="selectPriority('low')"
                >
                  <span class="priority-indicator low"></span>
                  <span>낮음</span>
                </button>
              </div>
            </div>

            <!-- 마감일 -->
            <div class="input-group" style="margin-bottom: 0;">
              <label for="taskDueDateInput" class="input-label">
                <span>마감일</span>
                <span class="optional-text">선택사항</span>
              </label>
              <div class="date-input-wrapper">
                <input type="date" id="taskDueDateInput" class="date-input" />
                <button
                  type="button"
                  class="date-clear-btn"
                  onclick="clearDueDateInput()"
                  title="마감일 선택 해제"
                >
                  초기화
                </button>
              </div>
            </div>
          </div>

          <!-- 제출 버튼 -->
          <div style="margin-top: 18px;">
            <button type="submit" class="submit-btn" id="submitBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>업무 등록하기</span>
            </button>
          </div>
        </form>
      </section>

      <!-- 업무 목록 영역 -->
      <section aria-labelledby="listSectionTitle">
        <div class="list-header-bar">
          <div class="list-count-summary">
            <span id="listSectionTitle">업무 목록</span>
            <span id="totalCountBadge" class="summary-badge">0개</span>
          </div>

          <!-- 필터 탭 -->
          <div class="filter-group" role="tablist">
            <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">전체 (<span id="countAll">0</span>)</button>
            <button class="filter-chip" data-filter="active" onclick="setFilter('active')">진행 중 (<span id="countActive">0</span>)</button>
            <button class="filter-chip" data-filter="today" onclick="setFilter('today')">오늘 마감 (<span id="countToday">0</span>)</button>
            <button class="filter-chip" data-filter="overdue" onclick="setFilter('overdue')">기한 지남 (<span id="countOverdue">0</span>)</button>
            <button class="filter-chip" data-filter="completed" onclick="setFilter('completed')">완료됨 (<span id="countCompleted">0</span>)</button>
          </div>
        </div>

        <!-- 업무 리스트 컨테이너 -->
        <div id="tasksList" class="tasks-container">
          <!-- 자바스크립트로 동적 렌더링 -->
        </div>

        <!-- 빈 상태 표시 -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <p class="empty-title" id="emptyTitle">등록된 업무가 없습니다</p>
          <p class="empty-description" id="emptyDescription">
            상단 입력창에서 업무명과 마감일을 입력하고 등록해보세요.
          </p>
        </div>
      </section>

      <!-- 하단 안내 -->
      <footer class="footer-tools">
        <div>내 업무 플래너 &bull; 개인 로컬 전용</div>
        <div>새로고침해도 입력된 업무가 안전하게 유지됩니다.</div>
      </footer>
    </div>

    <!-- 인라인 스크립트: 단일 index.html 더블클릭 실행 지원 -->
    <script>
      (function () {
        'use strict';

        const STORAGE_KEY = 'my_work_planner_tasks_v1';

        // 상태
        let tasks = [];
        let selectedPriority = 'medium';
        let currentFilter = 'all';

        // DOM 요소 캐싱
        const taskTitleInput = document.getElementById('taskTitleInput');
        const titleValidationMsg = document.getElementById('titleValidationMsg');
        const taskDueDateInput = document.getElementById('taskDueDateInput');
        const tasksList = document.getElementById('tasksList');
        const emptyState = document.getElementById('emptyState');
        const emptyTitle = document.getElementById('emptyTitle');
        const emptyDescription = document.getElementById('emptyDescription');
        const alertBanner = document.getElementById('alertBanner');
        const alertBannerMessage = document.getElementById('alertBannerMessage');
        const saveIndicator = document.getElementById('saveIndicator');
        const currentDateDisplay = document.getElementById('currentDateDisplay');

        // 필터 카운트 요소
        const countAll = document.getElementById('countAll');
        const countActive = document.getElementById('countActive');
        const countToday = document.getElementById('countToday');
        const countOverdue = document.getElementById('countOverdue');
        const countCompleted = document.getElementById('countCompleted');
        const totalCountBadge = document.getElementById('totalCountBadge');

        // 로컬 기준 오늘 날짜 문자열 반환 (YYYY-MM-DD)
        function getLocalTodayString() {
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        }

        // 한국어 날짜 표시 포맷 (YYYY.MM.DD)
        function formatDateKorean(dateString) {
          if (!dateString) return '마감일 없음';
          const parts = dateString.split('-');
          if (parts.length === 3) {
            return `${parts[0]}.${parts[1]}.${parts[2]}`;
          }
          return dateString;
        }

        // 상단 오늘 날짜 배너 표시
        function initCurrentDateHeader() {
          const now = new Date();
          const year = now.getFullYear();
          const month = now.getMonth() + 1;
          const date = now.getDate();
          const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
          const dayName = dayNames[now.getDay()];
          currentDateDisplay.textContent = `${year}년 ${month}월 ${date}일 (${dayName})`;
        }

        // localStorage 저장
        function saveTasksToStorage() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            hideAlert();
            showSaveSuccessIndicator();
            return true;
          } catch (e) {
            console.error('Failed to save to localStorage:', e);
            showAlert('저장되지 않았습니다. 브라우저 저장소 용량이 가득 찼거나 권한이 제한되어 있습니다.');
            return false;
          }
        }

        // localStorage 로드
        function loadTasksFromStorage() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
              // 최초 실행 시 요구사항: "처음에는 빈 목록으로 시작해. 샘플 데이터를 새로고침할 때마다 추가하지 마."
              tasks = [];
              return;
            }
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              tasks = parsed;
            } else {
              tasks = [];
            }
          } catch (e) {
            console.error('Failed to parse tasks from localStorage:', e);
            tasks = [];
            showAlert('저장된 데이터를 불러오는 중 오류가 발생했습니다.');
          }
        }

        // 알림 표시
        function showAlert(msg) {
          alertBannerMessage.textContent = msg;
          alertBanner.classList.add('active');
        }

        function hideAlert() {
          alertBanner.classList.remove('active');
        }

        // 저장 완료 뱃지 잠깐 반짝임
        let saveTimer = null;
        function showSaveSuccessIndicator() {
          if (!saveIndicator) return;
          saveIndicator.classList.add('visible');
          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            saveIndicator.classList.remove('visible');
          }, 1500);
        }

        // 우선순위 라벨 및 색상 정보
        const PRIORITY_MAP = {
          high: { label: '높음', badgeClass: 'badge-priority-high', colorText: '#dc2626' },
          medium: { label: '보통', badgeClass: 'badge-priority-medium', colorText: '#2563eb' },
          low: { label: '낮음', badgeClass: 'badge-priority-low', colorText: '#475569' }
        };

        // 우선순위 선택 함수
        window.selectPriority = function (priority) {
          selectedPriority = priority;
          document.querySelectorAll('.priority-btn').forEach(btn => {
            const isTarget = btn.getAttribute('data-priority') === priority;
            btn.classList.toggle('active', isTarget);
            btn.setAttribute('aria-checked', isTarget ? 'true' : 'false');
          });
        };

        // 마감일 인풋 초기화
        window.clearDueDateInput = function () {
          taskDueDateInput.value = '';
          taskDueDateInput.focus();
        };

        // 필터 설정
        window.setFilter = function (filter) {
          currentFilter = filter;
          document.querySelectorAll('.filter-chip').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
          });
          render();
        };

        // 새 업무 등록 핸들러
        window.handleAddTask = function () {
          const rawTitle = taskTitleInput.value;
          const trimmedTitle = rawTitle.trim();

          // 1. 공백만 있는 제목 검증 & 이유 안내
          if (!trimmedTitle) {
            taskTitleInput.classList.add('has-error');
            titleValidationMsg.classList.add('active');
            taskTitleInput.focus();
            return;
          }

          // 에러 해제
          taskTitleInput.classList.remove('has-error');
          titleValidationMsg.classList.remove('active');

          const dueDateVal = taskDueDateInput.value || null;

          // 고유 ID 생성 (타임스탬프 + 랜덤 문자열)
          const newTask = {
            id: 'task_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
            title: trimmedTitle,
            priority: selectedPriority || 'medium',
            dueDate: dueDateVal,
            completed: false,
            createdAt: Date.now()
          };

          // 목록 맨 앞에 추가
          tasks.unshift(newTask);

          // 등록 직후 저장
          saveTasksToStorage();

          // 입력 폼 리셋
          taskTitleInput.value = '';
          taskDueDateInput.value = '';
          selectPriority('medium');
          taskTitleInput.focus();

          render();
        };

        // 실시간 입력 중 에러 상태 해제
        taskTitleInput.addEventListener('input', function () {
          if (taskTitleInput.value.trim()) {
            taskTitleInput.classList.remove('has-error');
            titleValidationMsg.classList.remove('active');
          }
        });

        // 완료 상태 토글 (완료 체크 / 해제)
        window.toggleTaskComplete = function (taskId) {
          const task = tasks.find(t => t.id === taskId);
          if (!task) return;

          task.completed = !task.completed;
          if (task.completed) {
            task.completedAt = Date.now();
          } else {
            delete task.completedAt;
          }

          // 변경 직후 저장
          saveTasksToStorage();
          render();
        };

        // 업무 삭제: 선택한 항목만 삭제
        window.deleteTask = function (taskId) {
          const targetTask = tasks.find(t => t.id === taskId);
          if (!targetTask) return;

          // 선택한 단일 항목만 필터링 삭제
          tasks = tasks.filter(t => t.id !== taskId);

          // 삭제 직후 저장
          saveTasksToStorage();
          render();
        };

        // 날짜 상태 판정 함수
        // 규칙:
        // - 사용자의 로컬 날짜를 기준으로 비교
        // - 오늘을 기한 지남으로 표시하지 마 (오늘 마감으로 표시)
        // - 완료된 업무는 기한 지남 표시에서 제외
        function getTaskDateStatus(task, todayStr) {
          if (!task.dueDate) {
            return { type: 'none', label: '마감일 없음', badgeClass: 'badge-date' };
          }

          if (task.completed) {
            return {
              type: 'completed',
              label: formatDateKorean(task.dueDate),
              badgeClass: 'badge-date'
            };
          }

          if (task.dueDate < todayStr) {
            // 오늘 이전 날짜의 미완료 업무 -> '기한 지남'
            return {
              type: 'overdue',
              label: `기한 지남 (${formatDateKorean(task.dueDate)})`,
              badgeClass: 'badge-status-overdue'
            };
          } else if (task.dueDate === todayStr) {
            // 오늘 날짜 -> '오늘 마감'
            return {
              type: 'today',
              label: '오늘 마감',
              badgeClass: 'badge-status-today'
            };
          } else {
            // 미래 날짜
            return {
              type: 'future',
              label: formatDateKorean(task.dueDate),
              badgeClass: 'badge-date'
            };
          }
        }

        // 전체 렌더링 함수
        function render() {
          const todayStr = getLocalTodayString();

          // 1. 통계 계산
          let totalCount = tasks.length;
          let activeCount = 0;
          let todayCount = 0;
          let overdueCount = 0;
          let completedCount = 0;

          tasks.forEach(t => {
            if (t.completed) {
              completedCount++;
            } else {
              activeCount++;
              if (t.dueDate === todayStr) {
                todayCount++;
              } else if (t.dueDate && t.dueDate < todayStr) {
                overdueCount++;
              }
            }
          });

          // 카운트 배지 갱신
          totalCountBadge.textContent = `${totalCount}개`;
          countAll.textContent = totalCount;
          countActive.textContent = activeCount;
          countToday.textContent = todayCount;
          countOverdue.textContent = overdueCount;
          countCompleted.textContent = completedCount;

          // 2. 현재 필터에 따른 목록 추출
          let filtered = tasks.filter(t => {
            if (currentFilter === 'active') return !t.completed;
            if (currentFilter === 'completed') return t.completed;
            if (currentFilter === 'today') return !t.completed && t.dueDate === todayStr;
            if (currentFilter === 'overdue') return !t.completed && t.dueDate && t.dueDate < todayStr;
            return true; // 'all'
          });

          // 3. 렌더링 처리
          tasksList.innerHTML = '';

          if (filtered.length === 0) {
            emptyState.style.display = 'block';
            if (tasks.length === 0) {
              emptyTitle.textContent = '등록된 업무가 없습니다';
              emptyDescription.textContent = '상단 입력창에서 첫 번째 업무를 등록하고 마감일과 우선순위를 관리해보세요!';
            } else {
              emptyTitle.textContent = '해당 조건의 업무가 없습니다';
              emptyDescription.textContent = '선택한 필터 조건에 일치하는 업무 항목이 없습니다.';
            }
          } else {
            emptyState.style.display = 'none';

            filtered.forEach(task => {
              const card = document.createElement('div');
              card.className = `task-card ${task.completed ? 'completed' : ''}`;
              card.id = `card-${task.id}`;

              const priorityInfo = PRIORITY_MAP[task.priority] || PRIORITY_MAP.medium;
              const dateStatus = getTaskDateStatus(task, todayStr);

              // SVG 아이콘들
              const checkmarkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
              const trashSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;

              card.innerHTML = `
                <div class="checkbox-wrapper">
                  <div
                    class="custom-checkbox ${task.completed ? 'checked' : ''}"
                    role="checkbox"
                    aria-checked="${task.completed ? 'true' : 'false'}"
                    tabindex="0"
                    title="${task.completed ? '미완료로 변경' : '완료로 표시'}"
                    onclick="toggleTaskComplete('${task.id}')"
                    onkeydown="if(event.key === ' ' || event.key === 'Enter') { event.preventDefault(); toggleTaskComplete('${task.id}'); }"
                  >
                    ${checkmarkSvg}
                  </div>
                </div>

                <div class="task-content">
                  <div class="task-title">${escapeHtml(task.title)}</div>
                  <div class="task-meta-row">
                    <span class="badge ${priorityInfo.badgeClass}">
                      <span class="priority-indicator ${task.priority}" style="width: 6px; height: 6px;"></span>
                      우선순위: ${priorityInfo.label}
                    </span>
                    <span class="badge ${dateStatus.badgeClass}">
                      ${dateStatus.label}
                    </span>
                    ${task.completed ? '<span class="badge badge-status-completed">완료됨</span>' : ''}
                  </div>
                </div>

                <button
                  type="button"
                  class="delete-btn"
                  title="업무 삭제"
                  aria-label="업무 삭제"
                  onclick="deleteTask('${task.id}')"
                >
                  ${trashSvg}
                </button>
              `;

              tasksList.appendChild(card);
            });
          }
        }

        // HTML 이스케이프 유틸리티 (XSS 방지)
        function escapeHtml(str) {
          if (!str) return '';
          return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        // 초기화 실행
        initCurrentDateHeader();
        loadTasksFromStorage();
        render();

      })();
    </script>
  </body>
</html>
